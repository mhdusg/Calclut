<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تین دونات | محاسبه‌گر قیمت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#20130d;
    --bg2:#2b1a12;
    --card:#332017;
    --card2:#3e281b;
    --line:#4a3122;
    --pink:#ff5c8a;
    --pink-d:#3a1520;
    --yellow:#ffcb47;
    --yellow-d:#3a2c10;
    --mint:#4ed9b0;
    --mint-d:#12332a;
    --orange:#ff9a4d;
    --orange-d:#3a2412;
    --blue:#6fb8ff;
    --blue-d:#122a3a;
    --cream:#f8ede0;
    --muted:#c9ae97;
    --danger:#ff6b6b;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(ellipse at top, var(--bg2), var(--bg) 60%);
    color:var(--cream);
    font-family:'Vazirmatn',sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:22px 16px 8px;
    text-align:center;
  }
  header h1{
    margin:0;
    font-size:22px;
    font-weight:800;
    background:linear-gradient(90deg,var(--pink),var(--yellow));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:.5px;
  }
  header p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:12.5px;
  }

  nav.tabs{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:16px 14px 10px;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:transparent;
    border:none;
    cursor:pointer;
    padding:4px 2px;
    color:var(--muted);
    font-family:inherit;
  }
  .tab-btn .ring{
    width:44px;height:44px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);
    border:2px solid var(--line);
    transition:.15s;
  }
  .tab-btn.active .ring{
    border-color:var(--tab-color, var(--pink));
    background:var(--tab-color-d, var(--pink-d));
    box-shadow:0 0 0 4px color-mix(in srgb, var(--tab-color,var(--pink)) 15%, transparent);
  }
  .tab-btn span{font-size:10.5px;font-weight:600;white-space:nowrap;}
  .tab-btn.active{color:var(--cream);}
  .tab-btn.active span{color:var(--tab-color,var(--pink));}

  main{padding:6px 14px 24px; max-width:640px; margin:0 auto;}
  .section-title{
    font-size:14px;font-weight:700;margin:18px 0 8px;color:var(--muted);
    display:flex;align-items:center;gap:8px;
  }
  .section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--pink);}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
  }
  .row{display:flex;gap:8px;}
  .field{flex:1;display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
  .field label{font-size:11px;color:var(--muted);}
  input[type=text], input[type=number], select{
    background:var(--bg2);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:10px;
    padding:9px 10px;
    font-family:inherit;
    font-size:13.5px;
    width:100%;
  }
  input::placeholder{color:#8a6f5c;}
  input:focus, select:focus{outline:2px solid var(--pink); outline-offset:1px;}

  .btn{
    background:var(--pink);
    color:#2a0f18;
    border:none;
    border-radius:10px;
    padding:9px 14px;
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:var(--card2); color:var(--cream); border:1px solid var(--line);}
  .btn.mint{background:var(--mint); color:#08261d;}
  .btn.block{width:100%;}
  .btn-icon{
    background:none;border:none;color:var(--danger);cursor:pointer;font-size:15px;padding:4px 6px;
  }

  .item-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .item-row:last-child{border-bottom:none;}
  .item-row .meta{color:var(--muted); font-size:11.5px;}
  .item-row .name{font-weight:600;}
  .item-row .price{color:var(--yellow); font-weight:700; white-space:nowrap;}

  .empty{color:var(--muted); font-size:12.5px; text-align:center; padding:14px 0;}

  .pill{
    display:inline-block; padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:700;
  }
  .pill.qanadi{background:var(--pink-d); color:var(--pink);}
  .pill.plastic{background:var(--blue-d); color:var(--blue);}
  .pill.other{background:var(--mint-d); color:var(--mint);}

  .card-header{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
  }
  .card-header .title-input{
    font-weight:700; font-size:15px; background:transparent; border:none; color:var(--cream);
    border-bottom:1px dashed var(--line); padding:2px 0; width:auto; max-width:60%;
  }

  .cost-line{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px; border-radius:12px; margin-top:8px; font-size:13px;
  }
  .cost-line.total{
    background:linear-gradient(90deg, var(--pink-d), var(--yellow-d));
    font-weight:800; font-size:15px;
  }
  .cost-line .val{color:var(--yellow); font-weight:800;}

  .selector-row{
    display:flex; gap:6px; margin-bottom:8px;
  }
  .selector-row select{flex:1.4;}
  .selector-row input{flex:.8;}
  .selector-row button{flex:.6;}

  .checkbox-row{
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); margin-bottom:10px;
  }
  .checkbox-row input{width:16px;height:16px;accent-color:var(--pink);}

  .menu-group{margin-bottom:18px;}
  .menu-group h3{
    font-size:13px; margin:0 0 8px; color:var(--muted); display:flex; align-items:center; gap:6px;
  }
  .menu-item{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:11px 13px; margin-bottom:8px;
  }
  .menu-item .name{font-weight:700; font-size:13.5px;}
  .menu-item .sub{font-size:11px; color:var(--muted); margin-top:2px;}
  .menu-item .price{font-size:16px; font-weight:800; color:var(--yellow); white-space:nowrap;}

  .hint{font-size:11px;color:var(--muted); margin-top:-2px; margin-bottom:8px; line-height:1.7;}
  .saved-badge{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--mint); color:#08261d; font-weight:700; font-size:12px;
    padding:7px 16px; border-radius:20px; opacity:0; transition:.25s;
    pointer-events:none; max-width:88%; text-align:center;
  }
  .saved-badge.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .saved-badge.error{
    background:var(--danger); color:#3a0808; pointer-events:auto; cursor:pointer;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,5,2,.7);
    z-index:60; display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    background:var(--card); width:100%; max-width:640px; max-height:88vh;
    overflow-y:auto; border-radius:20px 20px 0 0; padding:16px 16px 24px;
    border:1px solid var(--line); border-bottom:none;
  }
  .modal-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .modal-header h3{margin:0; font-size:15px;}
  .picker-tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; scrollbar-width:none;}
  .picker-tabs::-webkit-scrollbar{display:none;}
  .picker-tab{
    flex:0 0 auto; padding:7px 13px; border-radius:20px; background:var(--bg2);
    border:1px solid var(--line); color:var(--muted); font-size:12px; font-family:inherit; cursor:pointer;
  }
  .picker-tab.active{background:var(--pink-d); color:var(--pink); border-color:var(--pink);}
  .picker-list{max-height:44vh; overflow-y:auto;}
  .picker-row{
    display:flex; align-items:flex-start; gap:10px; padding:10px 4px;
    border-bottom:1px solid var(--line); font-size:13px; cursor:pointer;
  }
  .picker-row input[type=checkbox]{width:18px; height:18px; accent-color:var(--pink); flex-shrink:0; margin-top:2px;}
  .picker-row .sub{color:var(--muted); font-size:11px; margin-top:2px;}
  .amount-step{text-align:center; padding:8px 0 4px;}
  .amount-step .progress{font-size:11.5px; color:var(--muted); margin-bottom:6px;}
  .amount-step .item-name{font-size:16px; font-weight:700; margin-bottom:14px;}
  .amount-step input{font-size:18px; text-align:center; padding:12px;}
</style>
</head>
<body>

<header>
  <h1>🍩 تین دونات</h1>
  <p>محاسبه‌گر قیمت تمام‌شده و قیمت فروش</p>
  <button class="btn secondary" id="backupToggle" style="margin-top:10px; font-size:11.5px; padding:6px 12px;" onclick="toggleBackup()">💾 پشتیبان‌گیری دستی</button>
</header>

<div id="backupPanel" style="display:none; max-width:640px; margin:0 auto 8px; padding:0 14px;">
  <div class="card">
    <div class="hint">اگه ذخیره‌ی خودکار کار نکرد، این متن رو کپی کن و یه جای امن (مثلا نوت گوشیت) نگه دار. هروقت خواستی برگردونی، همون متن رو تو کادر پایین پیست کن و بزن «بازیابی».</div>
    <label style="font-size:11px;color:var(--muted);">خروجی فعلی (برای کپی کردن)</label>
    <textarea id="backupOut" rows="4" readonly style="width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:9px 10px;font-family:monospace;font-size:11px;resize:vertical;margin:6px 0;"></textarea>
    <button class="btn mint block" onclick="copyBackup()">📋 کپی کردن</button>
    <div style="height:14px;"></div>
    <label style="font-size:11px;color:var(--muted);">بازیابی از متن پشتیبان</label>
    <textarea id="backupIn" rows="4" placeholder="متن پشتیبان رو اینجا پیست کن..." style="width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:9px 10px;font-family:monospace;font-size:11px;resize:vertical;margin:6px 0;"></textarea>
    <button class="btn secondary block" onclick="restoreBackup()">♻️ بازیابی</button>
  </div>
</div>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div class="saved-badge" id="savedBadge" onclick="if(this.classList.contains('error')) attemptSave()">ذخیره شد</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="if(event.target===this) closeModal()">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<script>
/* ============ STATE ============ */
const STORAGE_KEY = 'pricing-state';
let state = {
  materials: { qanadi: [], plastic: [], other: [] },
  labor: [],
  base: { items: [], yield: 1 },
  donuts: [],
  hotDrinks: [],
  coldDrinks: []
};
let activeTab = 'materials';

const TABS = [
  { id:'materials', label:'مواد اولیه', color:'var(--yellow)', colorD:'var(--yellow-d)', icon:matIcon() },
  { id:'labor',     label:'نیروی کار',  color:'var(--mint)',   colorD:'var(--mint-d)',   icon:laborIcon() },
  { id:'base',      label:'بیس دونات',  color:'var(--pink)',   colorD:'var(--pink-d)',   icon:donutIcon('var(--pink)') },
  { id:'donuts',    label:'دونات‌ها',   color:'var(--pink)',   colorD:'var(--pink-d)',   icon:donutIcon('var(--pink)') },
  { id:'hot',       label:'نوشیدنی گرم',color:'var(--orange)', colorD:'var(--orange-d)', icon:cupIcon('var(--orange)') },
  { id:'cold',      label:'نوشیدنی سرد',color:'var(--blue)',   colorD:'var(--blue-d)',   icon:cupIcon('var(--blue)') },
  { id:'menu',      label:'منو نهایی',  color:'var(--cream)',  colorD:'var(--card2)',    icon:menuIcon() },
];

function matIcon(){return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4" stroke="currentColor" stroke-width="2"/><path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;}
function laborIcon(){return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="2"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;}
function donutIcon(c){return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="${c}" stroke-width="2.5"/><circle cx="12" cy="12" r="3" stroke="${c}" stroke-width="2"/><circle cx="12" cy="5.5" r="1" fill="${c}"/><circle cx="17" cy="9" r="1" fill="${c}"/><circle cx="7" cy="9" r="1" fill="${c}"/></svg>`;}
function cupIcon(c){return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 8h12l-1.2 10.2a2 2 0 01-2 1.8H9.2a2 2 0 01-2-1.8L6 8z" stroke="${c}" stroke-width="2"/><path d="M6 8V6a2 2 0 012-2h8a2 2 0 012 2v2" stroke="${c}" stroke-width="2"/></svg>`;}
function menuIcon(){return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 4h14M5 10h14M5 16h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;}

/* ============ STORAGE ============ */
const SEED_MATERIALS = {
  qanadi: ["شیر,0,0,عدد","خامه,0,0,بسته","آب پنیر,0,0,کیلو","گلوتن,0,0,کیلو","آرد,0,0,بسته","شکر,0,0,گرم","قند,0,0,کیلو","پودر قند,0,0,کیلو","بکینگ پودر,0,0,بسته","وانیل,0,0,بسته","بهبود,0,0,بسته","روغن سرخ کردنی,0,0,کیلو","پودر نارگیل,0,0,گرم","پودر کاکائو,0,0,گرم","یخ,0,0,بسته","هندوانه,0,0,کیلو","طالبی,0,0,کیلو","توت فرنگی,0,0,کیلو","موز,0,0,کیلو","انبه,0,0,کیلو","شکلات سفید,0,0,کیلو","شکلات شکلاتی,0,0,کیلو","شکلات موزی,0,0,کیلو","شکلات توت فرنگی,0,0,کیلو","شکلات پسته,0,0,کیلو","شکلات تلخ,0,0,کیلو","شکلات نسکافه,0,0,کیلو","شکلات فندقی,0,0,کیلو","اسمارتیز,0,0,کیلو","ترافل,0,0,کیلو","کارامل,0,0,کیلو","شیر عسل,0,0,کیلو","نوتلا,0,0,بسته","ارئو,0,0,بسته","کیت کت,0,0,عدد","اسنیکرز,0,0,عدد","سیروپ لیمو,0,0,بطری","پودر پینک چاکلت,0,0,کیلو","پودر هات چاکلت,0,0,بسته","پودر وایت چاکلت,0,0,بسته","قهوه عربیکا,0,0,کیلو","قهوه ۷۰/۳۰,0,0,کیلو","پودر چای کرک,0,0,کیلو","پودر ماسالا,0,0,کیلو","نسکافه,0,0,بسته","چای,0,0,بسته","نبات,0,0,کیلو","آب معدنی,0,0,بسته"],
  plastic: ["لیوان دابل,0,0,عدد","لیوان تک,0,0,عدد","لیوان ۱۸۰,0,0,عدد","لیوان ۳۶۰,0,0,عدد","درب لیوان ۳۶۰,0,0,عدد","لیوان شیک,0,0,گرم","آستری,0,0,رول","نی مغازه,0,0,گرم","نی اسنپ,0,0,گرم","پاکت اسنپ,0,0,کیلو","پک اسنپ,0,0,گرم","لیبل,0,0,گرم","ظرف تکی,0,0,کیلو","ظرف دوتایی,0,0,کیلو","هولدر دوتایی,0,0,کیلو","هولدر چهارتایی,0,0,گرم","کاغذ روغنی,0,0,کیلو","سلفون,0,0,رول","کیسه ۳ کیلویی شیری,0,0,کیلو","کیسه فریزر,0,0,بسته","رول دستگاه پوز,0,0,عدد"],
  other: ["دستمال کاغذی,0,0,بسته","دستکش,0,0,کیلو","کیسه زباله بزرگ,0,0,کیلو","کیسه زباله متوسط,0,0,کیلو","کیسه زباله کوچک,0,0,بسته","کیسه زباله سرویس بهداشتی,0,0,بسته","پاک کننده چند منظوره,0,0,عدد","شیشه پاک کن,0,0,عدد","قاشق,0,0,بسته","چاقو,0,0,بسته","شوکول,0,0,بسته"]
};
function seedMaterialsIfEmpty(){
  const totalExisting = state.materials.qanadi.length + state.materials.plastic.length + state.materials.other.length;
  if(totalExisting > 0) return false;
  Object.keys(SEED_MATERIALS).forEach(cat=>{
    SEED_MATERIALS[cat].forEach(line=>{
      const parts = line.split(',').map(p=>p.trim());
      state.materials[cat].push({id:uid(), name:parts[0], price:num(parts[1]), qty:num(parts[2]), unit:parts[3]||''});
    });
  });
  return true;
}
async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){ console.error('load failed', e); }
  const seeded = seedMaterialsIfEmpty();
  if(seeded) saveState();
  render();
}
let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>attemptSave(), 200);
}
function attemptSave(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    flashSaved();
    hideSaveError();
  }catch(e){
    console.error('save failed', e);
    showSaveError();
  }
}
function flashSaved(){
  const b = document.getElementById('savedBadge');
  b.classList.remove('error');
  b.textContent = 'ذخیره شد';
  b.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>b.classList.remove('show'), 900);
}
function showSaveError(){
  const b = document.getElementById('savedBadge');
  b.classList.add('show','error');
  b.textContent = '⚠️ حافظه مرورگر پر یا غیرفعاله — از پشتیبان دستی استفاده کن';
  clearTimeout(flashSaved._t);
}
function hideSaveError(){
  const b = document.getElementById('savedBadge');
  b.classList.remove('error');
}

/* ============ HELPERS ============ */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
function catLabel(cat){ return cat==='qanadi'?'لوازم قنادی':cat==='plastic'?'لوازم پلاستیکی':'سایر'; }

function allMaterials(){
  return [
    ...state.materials.qanadi.map(m=>({...m,cat:'qanadi'})),
    ...state.materials.plastic.map(m=>({...m,cat:'plastic'})),
    ...state.materials.other.map(m=>({...m,cat:'other'})),
  ];
}
function findMaterial(id){ return allMaterials().find(m=>m.id===id); }
function findLabor(id){ return state.labor.find(l=>l.id===id); }
function materialUnitPrice(m){ return m.qty>0 ? m.price/m.qty : 0; }
function laborHourly(l){ return l.hours>0 ? l.salary/l.hours : 0; }

function itemCost(it){
  if(it.refType==='material'){
    const m = findMaterial(it.refId);
    return m ? materialUnitPrice(m)*it.amount : 0;
  }else{
    const l = findLabor(it.refId);
    return l ? laborHourly(l)*it.amount : 0;
  }
}
function itemsCost(items){ return items.reduce((s,it)=>s+itemCost(it),0); }
function itemLabel(it){
  if(it.refType==='material'){
    const m = findMaterial(it.refId);
    return m ? `${m.name} (${it.amount} ${m.unit||''})` : 'حذف‌شده';
  }else{
    const l = findLabor(it.refId);
    return l ? `${l.name} (${it.amount} ساعت)` : 'حذف‌شده';
  }
}
function baseCostTotal(){ return itemsCost(state.base.items); }
function baseCostPerUnit(){ const y=state.base.yield||1; return y>0 ? baseCostTotal()/y : 0; }
function recipeCost(recipe, useBase){
  let c = itemsCost(recipe.items);
  if(useBase) c += baseCostPerUnit();
  return c;
}
function finalPrice(cost, margin){ return cost*(margin>0?margin:1); }

/* ============ RENDER SHELL ============ */
function render(){
  renderTabs();
  renderMain();
}
function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map(t=>`
    <button class="tab-btn ${activeTab===t.id?'active':''}" data-tab="${t.id}"
      style="--tab-color:${t.color}; --tab-color-d:${t.colorD};">
      <span class="ring">${t.icon}</span>
      <span>${t.label}</span>
    </button>
  `).join('');
  nav.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeTab = btn.dataset.tab; render(); });
  });
}
function renderMain(){
  const main = document.getElementById('main');
  if(activeTab==='materials') main.innerHTML = viewMaterials();
  else if(activeTab==='labor') main.innerHTML = viewLabor();
  else if(activeTab==='base') main.innerHTML = viewBase();
  else if(activeTab==='donuts') main.innerHTML = viewRecipes('donuts','دونات', true);
  else if(activeTab==='hot') main.innerHTML = viewRecipes('hotDrinks','نوشیدنی گرم', false);
  else if(activeTab==='cold') main.innerHTML = viewRecipes('coldDrinks','نوشیدنی سرد', false);
  else if(activeTab==='menu') main.innerHTML = viewMenu();
  attachHandlers();
}

/* ============ EVENT HANDLERS ============ */
function attachHandlers(){
  const main = document.getElementById('main');
  main.querySelectorAll('[data-action]').forEach(elm=>{
    const action = elm.dataset.action;

    if(action==='add-material'){
      elm.addEventListener('click', ()=>{
        const cat = elm.dataset.cat;
        const name = document.getElementById(`mat-name-${cat}`).value.trim();
        const price = num(document.getElementById(`mat-price-${cat}`).value);
        const qty = num(document.getElementById(`mat-qty-${cat}`).value);
        const unit = document.getElementById(`mat-unit-${cat}`).value.trim();
        if(!name || price<=0 || qty<=0) return;
        state.materials[cat].push({id:uid(), name, price, qty, unit});
        saveState(); render();
      });
    }
    if(action==='bulk-add-material'){
      elm.addEventListener('click', ()=>{
        const cat = elm.dataset.cat;
        const ta = document.getElementById(`mat-bulk-${cat}`);
        const lines = ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
        let added = 0;
        lines.forEach(line=>{
          const parts = line.split(',').map(p=>p.trim());
          const name = parts[0];
          if(!name) return;
          const price = parts[1]!==undefined ? num(parts[1]) : 0;
          const qty = parts[2]!==undefined ? num(parts[2]) : 0;
          const unit = parts[3] || '';
          state.materials[cat].push({id:uid(), name, price, qty, unit});
          added++;
        });
        if(added>0){ ta.value=''; saveState(); render(); }
      });
    }
    if(action==='edit-material'){
      elm.addEventListener('change', ()=>{
        const cat = elm.dataset.cat, id = elm.dataset.id, field = elm.dataset.field;
        const m = state.materials[cat].find(x=>x.id===id);
        if(!m) return;
        if(field==='unit') m.unit = elm.value.trim();
        else m[field] = num(elm.value);
        saveState(); render();
      });
    }
    if(action==='del-material'){
      elm.addEventListener('click', ()=>{
        const cat = elm.dataset.cat, id = elm.dataset.id;
        state.materials[cat] = state.materials[cat].filter(m=>m.id!==id);
        saveState(); render();
      });
    }
    if(action==='add-labor'){
      elm.addEventListener('click', ()=>{
        const name = document.getElementById('lab-name').value.trim();
        const salary = num(document.getElementById('lab-salary').value);
        const hours = num(document.getElementById('lab-hours').value);
        if(!name || salary<=0 || hours<=0) return;
        state.labor.push({id:uid(), name, salary, hours});
        saveState(); render();
      });
    }
    if(action==='del-labor'){
      elm.addEventListener('click', ()=>{
        state.labor = state.labor.filter(l=>l.id!==elm.dataset.id);
        saveState(); render();
      });
    }
    if(action==='open-add-items'){
      elm.addEventListener('click', ()=>{
        openAddItemsModal(elm.dataset.key, elm.dataset.id || null);
      });
    }
    if(action==='del-item'){
      elm.addEventListener('click', ()=>{
        const scope = elm.dataset.scope;
        const idx = parseInt(elm.dataset.idx,10);
        removeItemFromScope(scope, idx, elm.dataset.recipeKey, elm.dataset.recipeId);
        saveState(); render();
      });
    }
    if(action==='save-base-yield'){
      elm.addEventListener('click', ()=>{
        state.base.yield = num(document.getElementById('base-yield').value) || 1;
        saveState(); render();
      });
    }
    if(action==='open-new-recipe'){
      elm.addEventListener('click', ()=>{
        openNewRecipeModal(elm.dataset.key, elm.dataset.label);
      });
    }
    if(action==='del-recipe'){
      elm.addEventListener('click', ()=>{
        const key = elm.dataset.key, id = elm.dataset.id;
        state[key] = state[key].filter(r=>r.id!==id);
        saveState(); render();
      });
    }
    if(action==='rename-recipe'){
      elm.addEventListener('change', ()=>{
        const key = elm.dataset.key, id = elm.dataset.id;
        const r = state[key].find(x=>x.id===id);
        if(r){ r.name = elm.value.trim() || r.name; saveState(); }
      });
    }
    if(action==='toggle-usebase'){
      elm.addEventListener('change', ()=>{
        const key = elm.dataset.key, id = elm.dataset.id;
        const r = state[key].find(x=>x.id===id);
        if(r){ r.useBase = elm.checked; saveState(); render(); }
      });
    }
    if(action==='set-margin'){
      elm.addEventListener('change', ()=>{
        const key = elm.dataset.key, id = elm.dataset.id;
        const r = state[key].find(x=>x.id===id);
        if(r){ r.margin = num(elm.value) || 1; saveState(); render(); }
      });
    }
  });
}

function pushItemToScope(scope, entry){
  if(scope==='base'){
    state.base.items.push(entry);
    return;
  }
  const [key, id] = splitScope(scope);
  const r = state[key].find(x=>x.id===id);
  if(r) r.items.push(entry);
}
function removeItemFromScope(scope, idx){
  if(scope==='base'){
    state.base.items.splice(idx,1);
    return;
  }
  const [key, id] = splitScope(scope);
  const r = state[key].find(x=>x.id===id);
  if(r) r.items.splice(idx,1);
}
function splitScope(scope){
  // scope format: "<key>-<id>", key is one of donuts/hotDrinks/coldDrinks, id is alnum from uid()
  const keys = ['donuts','hotDrinks','coldDrinks'];
  for(const k of keys){
    if(scope.startsWith(k+'-')) return [k, scope.slice(k.length+1)];
  }
  return [null,null];
}

/* ============ ITEM PICKER MODAL ============ */
let modalState = null;

function openNewRecipeModal(key, label){
  modalState = {mode:'newRecipe', key, recipeId:null, label, step:'name', name:'', selected:[], amountIdx:0, amounts:[], pickerTab:'labor'};
  renderModal();
}
function openAddItemsModal(key, recipeId){
  modalState = {mode:'addItems', key, recipeId: recipeId||null, step:'select', selected:[], amountIdx:0, amounts:[], pickerTab:'labor'};
  renderModal();
}
function closeModal(){
  modalState = null;
  const ov = document.getElementById('modalOverlay');
  if(ov) ov.style.display='none';
}
function isSelected(refType, refId){
  return modalState.selected.some(s=>s.refType===refType && s.refId===refId);
}
function toggleSelect(refType, refId){
  const idx = modalState.selected.findIndex(s=>s.refType===refType && s.refId===refId);
  if(idx>=0) modalState.selected.splice(idx,1);
  else modalState.selected.push({refType, refId});
  renderModal();
}
function modalItemLabel(sel){
  if(sel.refType==='material'){ const m=findMaterial(sel.refId); return m ? `${m.name}${m.unit?' ('+m.unit+')':''}` : ''; }
  const l = findLabor(sel.refId); return l ? `${l.name} (پرسنل)` : '';
}
function setPickerTab(tab){ modalState.pickerTab = tab; renderModal(); }

function renderModal(){
  const overlay = document.getElementById('modalOverlay');
  const sheet = document.getElementById('modalSheet');
  if(!modalState){ overlay.style.display='none'; return; }
  overlay.style.display='flex';

  if(modalState.step==='name'){
    sheet.innerHTML = `
      <div class="modal-header"><h3>${modalState.label} جدید</h3><button class="btn-icon" onclick="closeModal()">✕</button></div>
      <div class="field"><label>اسمش چیه؟</label><input type="text" id="modalNameInput" placeholder="مثلا ${modalState.label} شکلاتی" value="${modalState.name}"></div>
      <button class="btn block" onclick="modalConfirmName()">ادامه</button>
    `;
    setTimeout(()=>{ const inp=document.getElementById('modalNameInput'); if(inp) inp.focus(); },50);

  } else if(modalState.step==='select'){
    const tabs = [
      {id:'labor', label:'پرسنل'},
      {id:'qanadi', label:'لوازم قنادی'},
      {id:'plastic', label:'لوازم پلاستیکی'},
      {id:'other', label:'سایر'},
    ];
    let listHtml = '';
    if(modalState.pickerTab==='labor'){
      listHtml = state.labor.length===0 ? `<div class="empty">پرسنلی ثبت نشده</div>` : state.labor.map(l=>`
        <label class="picker-row">
          <input type="checkbox" ${isSelected('labor',l.id)?'checked':''} onchange="toggleSelect('labor','${l.id}')">
          <div><div>${l.name}</div><div class="sub">نرخ ساعتی: ${fmt(laborHourly(l))} تومان</div></div>
        </label>
      `).join('');
    }else{
      const items = state.materials[modalState.pickerTab];
      listHtml = items.length===0 ? `<div class="empty">موردی ثبت نشده</div>` : items.map(m=>`
        <label class="picker-row">
          <input type="checkbox" ${isSelected('material',m.id)?'checked':''} onchange="toggleSelect('material','${m.id}')">
          <div><div>${m.name}</div><div class="sub">واحد: ${m.unit||'-'} — قیمت واحد: ${fmt(materialUnitPrice(m))} تومان</div></div>
        </label>
      `).join('');
    }
    sheet.innerHTML = `
      <div class="modal-header"><h3>انتخاب مواد و پرسنل</h3><button class="btn-icon" onclick="closeModal()">✕</button></div>
      <div class="picker-tabs">
        ${tabs.map(t=>`<button class="picker-tab ${modalState.pickerTab===t.id?'active':''}" onclick="setPickerTab('${t.id}')">${t.label}</button>`).join('')}
      </div>
      <div class="picker-list">${listHtml}</div>
      <div class="hint" style="margin-top:10px;">${modalState.selected.length} مورد انتخاب شده</div>
      <button class="btn block" ${modalState.selected.length===0?'disabled style="opacity:.5;"':''} onclick="modalGoToAmounts()">ادامه</button>
    `;

  } else if(modalState.step==='amount'){
    const sel = modalState.selected[modalState.amountIdx];
    const label = modalItemLabel(sel);
    const isLast = modalState.amountIdx === modalState.selected.length-1;
    sheet.innerHTML = `
      <div class="modal-header"><h3>وارد کردن مقدار</h3><button class="btn-icon" onclick="closeModal()">✕</button></div>
      <div class="amount-step">
        <div class="progress">مورد ${modalState.amountIdx+1} از ${modalState.selected.length}</div>
        <div class="item-name">${label}</div>
        <input type="number" id="modalAmountInput" placeholder="مقدار" value="${modalState.amounts[modalState.amountIdx]||''}">
      </div>
      <div class="hint" style="text-align:center;">${sel.refType==='material'?'مقدار را با همان واحد خرید وارد کن':'مقدار را به ساعت وارد کن'}</div>
      <div class="row" style="margin-top:10px;">
        ${modalState.amountIdx>0?`<button class="btn secondary" style="flex:1;" onclick="modalPrevAmount()">قبلی</button>`:''}
        <button class="btn" style="flex:2;" onclick="modalNextAmount()">${isLast?'ثبت نهایی':'بعدی'}</button>
      </div>
    `;
    setTimeout(()=>{ const inp=document.getElementById('modalAmountInput'); if(inp) inp.focus(); },50);
  }
}

function modalConfirmName(){
  const v = document.getElementById('modalNameInput').value.trim();
  if(!v) return;
  modalState.name = v;
  modalState.step = 'select';
  renderModal();
}
function modalGoToAmounts(){
  if(modalState.selected.length===0) return;
  modalState.step='amount';
  modalState.amountIdx=0;
  modalState.amounts=[];
  renderModal();
}
function saveCurrentAmount(){
  const inp = document.getElementById('modalAmountInput');
  if(inp) modalState.amounts[modalState.amountIdx] = inp.value;
}
function modalPrevAmount(){
  saveCurrentAmount();
  modalState.amountIdx = Math.max(0, modalState.amountIdx-1);
  renderModal();
}
function modalNextAmount(){
  saveCurrentAmount();
  if(modalState.amountIdx < modalState.selected.length-1){
    modalState.amountIdx++;
    renderModal();
  }else{
    finalizeModal();
  }
}
function finalizeModal(){
  const items = modalState.selected
    .map((s,i)=>({refType:s.refType, refId:s.refId, amount:num(modalState.amounts[i])}))
    .filter(it=>it.amount>0);
  if(modalState.mode==='newRecipe'){
    state[modalState.key].push({id:uid(), name:modalState.name, items, useBase:false, margin:2});
  }else{
    if(modalState.key==='base'){
      state.base.items.push(...items);
    }else{
      const r = state[modalState.key].find(x=>x.id===modalState.recipeId);
      if(r) r.items.push(...items);
    }
  }
  saveState();
  modalState = null;
  document.getElementById('modalOverlay').style.display='none';
  render();
}

/* ============ BACKUP PANEL ============ */
function toggleBackup(){
  const panel = document.getElementById('backupPanel');
  const opening = panel.style.display === 'none';
  panel.style.display = opening ? 'block' : 'none';
  if(opening){
    document.getElementById('backupOut').value = JSON.stringify(state);
  }
}
function copyBackup(){
  const ta = document.getElementById('backupOut');
  ta.select();
  try{
    navigator.clipboard.writeText(ta.value);
  }catch(e){
    document.execCommand('copy');
  }
  const btn = event.target;
  const old = btn.textContent;
  btn.textContent = '✅ کپی شد';
  setTimeout(()=>{ btn.textContent = old; }, 1200);
}
function restoreBackup(){
  const raw = document.getElementById('backupIn').value.trim();
  if(!raw) return;
  try{
    const parsed = JSON.parse(raw);
    state = Object.assign({materials:{qanadi:[],plastic:[],other:[]}, labor:[], base:{items:[],yield:1}, donuts:[], hotDrinks:[], coldDrinks:[]}, parsed);
    saveState();
    render();
    document.getElementById('backupIn').value = '';
    alert('بازیابی شد ✅');
  }catch(e){
    alert('این متن معتبر نیست، دوباره چک کن که کامل کپی شده باشه.');
  }
}

/* ============ INIT ============ */
loadState();
</script>
